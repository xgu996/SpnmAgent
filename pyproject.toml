[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geostructure"
version = "0.0.1"
description = "Structure-preserving (energy-preserving) numerical methods with a deterministic contract kernel and an LLM agent layer, built on the GSGE framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "pydantic>=2.5",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "typer>=0.12",
]

# Development-only tools (PEP 735). `uv sync` installs the "dev" group by default.
[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
